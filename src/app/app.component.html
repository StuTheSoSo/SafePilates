<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <ion-footer translucent>
    <ion-toolbar class="tab-toolbar">
      <div class="tab-row">
        <button class="tab-btn" *ngFor="let tab of tabs" [class.selected]="isTabActive(tab.route)" (click)="navigate(tab.route)">
          <ion-icon [name]="tab.icon"></ion-icon>
          <span>{{ tab.label | translate }}</span>
        </button>
      </div>
    </ion-toolbar>
  </ion-footer>
</ion-app>
