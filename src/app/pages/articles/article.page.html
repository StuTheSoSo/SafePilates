<ion-header [translucent]="true"><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/"></ion-back-button></ion-buttons><ion-title>Studio notes</ion-title></ion-toolbar></ion-header><ion-content><article class="article-shell"><ion-icon name="compass-outline"></ion-icon><p class="eyebrow">Teaching notes</p><h1>{{ article.title }}</h1><p class="summary">{{ article.summary }}</p><section *ngFor="let section of article.sections"><h2>{{ section[0] }}</h2><p>{{ section[1] }}</p></section><aside><strong>Try this cue</strong><p>{{ article.cue }}</p></aside><footer><h2>Further reading</h2><a *ngFor="let resource of resources" [href]="resource.url" target="_blank" rel="noopener noreferrer">{{ resource.name }}<ion-icon name="open-outline"></ion-icon></a></footer></article></ion-content>
