<ion-header translucent>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Exercise Library</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="category-row ion-padding-top ion-padding-horizontal">
    <ion-chip *ngFor="let category of categories"
              outline
              [color]="selectedCategory === category ? 'primary' : 'secondary'"
              [class.selected]="selectedCategory === category"
              (click)="selectCategory(category)">
      {{ category }}
    </ion-chip>
  </div>

  <div class="page-hero ion-padding-horizontal">
    <ion-searchbar
      placeholder="Search exercises"
      [(ngModel)]="searchText"
      (ionInput)="onSearchTextChange($event)"
      debounce="300"
      showCancelButton="focus"
      animated="true"
      class="condition-searchbar">
    </ion-searchbar>

    <ion-note *ngIf="searchText.trim() && filteredExercises.length === 0" color="medium" class="search-empty">
      No exercises match "{{ searchText }}". Try a different keyword.
    </ion-note>
  </div>

  <ng-container *ngIf="libraryWarnings.length">
    <ion-card color="warning" class="ion-margin-horizontal ion-margin-top">
      <ion-card-header>
        <ion-card-subtitle>Library validation</ion-card-subtitle>
        <ion-card-title>Missing exercise metadata</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ libraryWarnings.length }} exercise(s) have missing focus or category values.</p>
        <ul>
          <li *ngFor="let warning of libraryWarnings">
            <strong>{{ warning.name }}</strong> — {{ warning.issues.join(', ') }}
          </li>
        </ul>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let exercise of filteredExercises">
        <ion-card class="exercise-card" button [disabled]="safetyService.isExercisePremium(exercise) && !safetyService.isPremiumActive()" (click)="openExercise(exercise.id, exercise)">
          <div class="premium-card-flag" *ngIf="safetyService.isExercisePremium(exercise) && !safetyService.isPremiumActive()">Pro</div>
          <ion-card-header>
            <ion-card-title [innerHTML]="highlightText(exercise.name)"></ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p [innerHTML]="highlightText(exercise.shortDescription)"></p>
            <p class="exercise-focus" [innerHTML]="highlightText('Focus: ' + exercise.focus)"></p>
            <p class="exercise-category" [innerHTML]="highlightText('Category: ' + exercise.category)"></p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <app-premium-banner (upgradeClick)="navigateToUpgrade()"></app-premium-banner>
</ion-content>
