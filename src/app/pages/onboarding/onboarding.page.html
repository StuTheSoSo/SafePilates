<ion-content [fullscreen]="true"><main class="onboarding-shell"><button class="skip" type="button" *ngIf="!isLastStep" (click)="skip()">Skip</button><section class="onboarding-card"><ion-icon [name]="currentStep.icon"></ion-icon><p class="eyebrow">PilateSafe Studio</p><h1>{{ currentStep.title }}</h1><p class="body-copy">{{ currentStep.body }}</p><div class="dots"><button type="button" *ngFor="let step of steps; let index = index" [class.selected]="index === currentStepIndex" (click)="currentStepIndex = index" [attr.aria-label]="'Go to step ' + (index + 1)"></button></div><div class="actions" *ngIf="isLastStep; else nextAction"><ion-button expand="block" (click)="finish('/planner')">Start a blank flow</ion-button><ion-button expand="block" fill="outline" (click)="finish('/templates')">Browse templates</ion-button><ion-button expand="block" fill="clear" (click)="finish('/library')">Explore library</ion-button></div><ng-template #nextAction><div class="actions"><ion-button fill="clear" (click)="back()" [disabled]="currentStepIndex === 0">Back</ion-button><ion-button (click)="next()">Next<ion-icon name="arrow-forward-outline" slot="end"></ion-icon></ion-button></div></ng-template></section></main></ion-content>
