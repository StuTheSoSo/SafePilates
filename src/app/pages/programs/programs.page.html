<ion-header translucent>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Programs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="programs-intro ion-padding-horizontal ion-padding-top">
    <p class="intro-text">Curated sequences for common goals — tap any program to see its exercises.</p>
  </div>

  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let program of programs">
        <ion-card button (click)="openProgram(program.id)">
          <ion-card-header>
            <div class="program-level-row">
              <ion-badge [color]="levelColor(program.level)">{{ program.level }}</ion-badge>
            </div>
            <ion-card-title>{{ program.name }}</ion-card-title>
            <ion-card-subtitle>{{ program.goal }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p class="program-description">{{ program.description }}</p>
            <div class="focus-chips">
              <ion-chip *ngFor="let area of program.focusAreas" outline color="primary" class="focus-chip">
                {{ area }}
              </ion-chip>
            </div>
            <p class="exercise-count">{{ program.exerciseIds.length }} exercises</p>

            <div class="program-note-box" (click)="$event.stopPropagation()">
              <ion-textarea
                rows="2"
                [(ngModel)]="programNotes[program.id]"
                placeholder="Quick note for this program"
                auto-grow="true"
                class="program-note-textarea"
                (click)="$event.stopPropagation()"
              ></ion-textarea>
              <div class="note-actions">
                <ion-button fill="outline" size="small" (click)="saveProgramNote(program.id); $event.stopPropagation()" aria-label="Save program note">Save</ion-button>
                <span *ngIf="noteSavedProgramId === program.id" class="note-saved">Saved</span>
              </div>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
