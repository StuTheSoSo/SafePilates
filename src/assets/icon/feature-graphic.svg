<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="Safe Pilates feature graphic">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1f7a"/>
      <stop offset="60%" stop-color="#5a3da8"/>
      <stop offset="100%" stop-color="#2d6db5"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#c7dcff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="iconcard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0a0030" flood-opacity="0.3"/>
    </filter>
    <filter id="textglow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#a78bfa" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="950" cy="60" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="980" cy="460" r="140" fill="rgba(255,255,255,0.03)"/>
  <circle cx="60" cy="440" r="120" fill="rgba(255,255,255,0.04)"/>

  <!-- Vertical divider -->
  <line x1="350" y1="60" x2="350" y2="440" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Icon card -->
  <rect x="55" y="80" width="250" height="340" rx="40" fill="url(#iconcard)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Shield + figure icon centred in card at (180, 250) -->
  <g transform="translate(180, 248)">
    <path d="M0,-82 c-48,20 -82,58 -82,101 0,74 82,130 82,130 s82,-56 82,-130 c0,-43 -34,-81 -82,-101 z"
          fill="url(#shield)" stroke="#ffffff" stroke-width="11" filter="url(#shadow)"/>
    <circle cx="0" cy="-24" r="22" fill="#7c5cbf"/>
    <path d="M-14,10 c0,0 -15,22 -15,36 0,12 8.5,20 15,24 h28 c6.5,-4 15,-12 15,-24 0,-14 -15,-36 -15,-36 z" fill="#7c5cbf"/>
    <path d="M-40,14 c18,-17 50,-17 80,0" fill="none" stroke="#7c5cbf" stroke-width="15" stroke-linecap="round"/>
    <path d="M-15,50 c0,10 8.5,17 18,17 s18,-7 18,-17" fill="none" stroke="#7c5cbf" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === RIGHT PANEL TEXT === -->

  <!-- App name -->
  <text x="385" y="148"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="78" font-weight="900" letter-spacing="-1"
        fill="#ffffff" filter="url(#textglow)">Safe Pilates</text>

  <!-- Category badge -->
  <rect x="385" y="163" width="224" height="34" rx="17" fill="rgba(167,139,250,0.35)" stroke="rgba(167,139,250,0.6)" stroke-width="1.5"/>
  <text x="497" y="185" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="700" fill="#e9d5ff">FOR PILATES INSTRUCTORS</text>

  <!-- Headline -->
  <text x="385" y="234"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="26" font-weight="700" fill="rgba(255,255,255,0.95)">Know which exercises to avoid —</text>
  <text x="385" y="268"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="26" font-weight="700" fill="rgba(255,255,255,0.95)">and what to recommend instead.</text>

  <!-- Subtitle -->
  <text x="385" y="308"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="21" fill="rgba(220,210,255,0.85)">Offline contraindication database • instructor notes</text>
  <text x="385" y="336"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="21" fill="rgba(220,210,255,0.85)">rehab, prenatal, senior, chronic pain support</text>

  <!-- Feature pills row 1 -->
  <rect x="385" y="362" width="168" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="469" y="386" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Contraindications</text>

  <rect x="564" y="362" width="140" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="634" y="386" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Modifications</text>

  <rect x="715" y="362" width="112" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="771" y="386" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Rehab-safe</text>

  <!-- Feature pills row 2 -->
  <rect x="385" y="412" width="96" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="433" y="436" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Prenatal</text>

  <rect x="492" y="412" width="88" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="536" y="436" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Seniors</text>

  <rect x="591" y="412" width="82" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="632" y="436" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Offline</text>

  <rect x="684" y="412" width="144" height="38" rx="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="756" y="436" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" fill="#ffffff">Studio Ready</text>
</svg>
